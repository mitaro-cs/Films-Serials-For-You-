[workspace]
resolver = "2"
members = ["server", "desktop/src-tauri"]
default-members = ["server", "desktop/src-tauri"]

[workspace.package]
version = "0.6.5-alpha"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
