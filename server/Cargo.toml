[package]
name = "fsfy-server"
description = "Nova — домашний кинотеатр на своём компьютере"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fsfy"
path = "src/lib.rs"

[[bin]]
name = "fsfy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23"
futures-util = "0.3"
hex = "0.4"
mime_guess = "2"
parking_lot = "0.13"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "gzip", "query"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
