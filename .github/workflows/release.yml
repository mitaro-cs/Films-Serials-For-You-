name: Release
# Выпуск с установщиками: .dmg (Apple Silicon и Intel) и .exe для Windows. Собирается сам:
# в `miaro` пришла новая версия (`version` в tauri.conf.json, тега v<версия> ещё нет) — тег и
# выпуск появляются после сборки. Тег v1.2.3, отправленный вручную, тоже собирает выпуск.
on:
  push:
    branches: [miaro]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v7
      - name: Новая ли версия
        id: v
        shell: bash
        run: |
          tag="v$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "$tag" ] || { echo "::error::Тег $GITHUB_REF_NAME, а версия приложения ${tag#v} — нужен тег $tag"; exit 1; }
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Выпуск $tag уже есть — собирать нечего"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Новая версия $tag — собираем выпуск"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      # Выпуск (и тег на этом коммите) — заранее, один раз: три сборки только выгружают файлы.
      - name: Выпуск
        if: steps.v.outputs.go == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Nova $TAG" \
            --notes "Установщики: .dmg - Mac (Apple Silicon - aarch64, Intel - x64), .exe - Windows. Что нового - в CHANGELOG.md."
          # Не «предварительный» даже у 0.x-alpha: автообновление берёт latest.json последнего обычного
          # выпуска (releases/latest), предварительные GitHub туда не отдаёт.

  build:
    needs: version
    if: needs.version.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ffmpeg: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            ffmpeg: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ffmpeg: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - name: Интерфейс
        working-directory: web
        run: npm ci && npm run build
      - name: ffmpeg в установщик
        shell: bash
        run: scripts/fetch-ffmpeg.sh ${{ matrix.ffmpeg }}
      - name: Зависимости оболочки
        working-directory: desktop
        run: npm ci
      # Подпись обновлений: секрет TAURI_SIGNING_PRIVATE_KEY (см. docs/host.md). Без него выпуск
      # всё равно собирается, только без файлов автообновления.
      - name: Подпись обновлений
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "extra=" >> "$GITHUB_OUTPUT"; else
            echo "::warning::Нет секрета TAURI_SIGNING_PRIVATE_KEY — выпуск без автообновления"
            echo "extra=--config src-tauri/no-updater.conf.json" >> "$GITHUB_OUTPUT"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          # Без tauriScript: tauri-action сам берёт `npm run tauri` и ставит `--` перед args.
          # С `npm run tauri --` получалось `tauri build -- --target …`: цель уходила в cargo,
          # а упаковщик искал программу в target/release (выпуск 0.1.1 упал так).
          args: --target ${{ matrix.target }} ${{ steps.sign.outputs.extra }}
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: "Nova ${{ needs.version.outputs.tag }}"
          releaseCommitish: ${{ github.sha }}
          releaseBody: "Установщики: .dmg — Mac (Apple Silicon — aarch64, Intel — x64), .exe — Windows. Что нового — в CHANGELOG.md."
          releaseDraft: false
          prerelease: false
      # Mac: подпись бандла цела — иначе «приложение повреждено» (0.3.0). Шаг после выгрузки:
      # не прячет выпуск, но красный выпуск сразу видно.
      - name: Проверка подписи (Mac)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target -maxdepth 6 -path "*/bundle/macos/*.app" | head -1)
          echo "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
